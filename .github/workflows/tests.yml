name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the brain tests
        run: python -m unittest discover -s tests

  repo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the repo tests
        run: python -m pytest -q tests

  desktop-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r server/requirements-linux.txt -r server/requirements-dev.txt
      - name: Run the desktop server tests
        run: .venv/bin/python -m pytest -q server/tests

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [apps/ios, apps/desktop/app, extensions/browser]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the tests
        run: node --test tests/
