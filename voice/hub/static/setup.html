<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my-voice · first-time setup</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <div class="top"><h1>my-voice</h1></div>
    <form class="card" method="post" action="/setup">
      <h2>First-time setup</h2>
      <p>Choose the email and password you'll use to log in here. This page only works once: after that, it's the login page.</p>
      <p class="error" id="error" hidden></p>
      <label for="setup_code">Setup code (in /var/lib/my-voice/setup-code on the server)</label>
      <input id="setup_code" name="setup_code" type="text" autocomplete="off" spellcheck="false" required autofocus />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password (at least 10 characters)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required />
      <label for="confirm">Password again</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required />
      <button class="primary" type="submit">Create account</button>
    </form>
  </main>
  <script src="/static/setup.js"></script>
</body>
</html>
